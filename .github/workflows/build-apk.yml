name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # .env is gitignored, so CI has no env file of its own. Without these the
      # bundle inlines the localhost fallback from src/services/api.ts and every
      # request fails on a real device (localhost resolves to the phone itself).
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://workgo-production.up.railway.app/api/v1' }}
      EXPO_PUBLIC_MAPTILER_KEY: ${{ secrets.EXPO_PUBLIC_MAPTILER_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        # firebase declares async-storage as an optional peer (^2||^3) while
        # Expo SDK 52 pins 1.23.1; npm 10's ci tries to auto-install 3.1.1 and
        # fails. The peer is optional, so bypass auto-peer resolution safely.
        run: npm ci --legacy-peer-deps

      - name: Write .env
        # Gradle's bundleReleaseJsAndAssets task may run on a cached daemon that
        # does not inherit this job's env, so also materialise .env on disk.
        # @expo/env loads it during the bundle step, which makes this authoritative.
        run: |
          printf 'EXPO_PUBLIC_API_URL=%s\n' "$EXPO_PUBLIC_API_URL" > .env
          printf 'EXPO_PUBLIC_MAPTILER_KEY=%s\n' "$EXPO_PUBLIC_MAPTILER_KEY" >> .env
          sed -e 's/^EXPO_PUBLIC_MAPTILER_KEY=.*/EXPO_PUBLIC_MAPTILER_KEY=<set>/' .env

      - name: Generate native project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_IMAGE_UTILS_NO_SHARP: "0"

      - name: Tune Gradle memory
        working-directory: mobile/android
        run: |
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError/' gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
          grep -n "jvmargs\|workers.max" gradle.properties

      - name: Build Release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Verify bundled API URL
        # Regression guard: EXPO_PUBLIC_* values are inlined at bundle time, so a
        # missing env var silently ships an APK that can never reach the server.
        run: |
          BUNDLE=$(find android/app/build -name 'index.android.bundle' -print -quit)
          if [ -z "$BUNDLE" ]; then
            echo "::warning::bundle not found, skipping API URL verification"
            exit 0
          fi
          echo "bundle: $BUNDLE"
          if grep -q 'localhost:5000' "$BUNDLE"; then
            echo "::error::localhost fallback was bundled - EXPO_PUBLIC_API_URL was not injected"
            exit 1
          fi
          echo "bundled hosts:"
          grep -oE 'https://[a-zA-Z0-9.-]+' "$BUNDLE" | sort -u | head -5 || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: workgo-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk